name: Deploy to EC2 (Remote Build)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key (PPK with Passphrase)
        run: |
          # Install PuTTY tools for conversion
          sudo apt-get update
          sudo apt-get install -y putty-tools
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 1. Save the PPK content to a file
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id.ppk
          
          # 2. Save the Passphrase to a file (using printf to avoid newline issues)
          # Crucial: echo adds a newline which breaks passwords. printf does not.
          printf "%s" "${{ secrets.EC2_SSH_PASSPHRASE }}" > ~/.ssh/passphrase.txt
          
          # 3. Convert PPK to OpenSSH format
          # FIXED: Used --old-passphrase instead of --passphrase-file
          echo "Converting PPK to OpenSSH format..."
          if ! puttygen ~/.ssh/id.ppk -O private-openssh -o ~/.ssh/id_rsa --old-passphrase ~/.ssh/passphrase.txt; then
             echo "::error::Conversion failed! Likely incorrect passphrase or corrupted PPK."
             exit 1
          fi
          
          # 4. Set strict permissions
          chmod 600 ~/.ssh/id_rsa
          
          # 5. Verify the key is valid and unencrypted
          # If this command prompts for a password or fails, the conversion didn't work
          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null; then
             echo "::error::Generated key is still encrypted or invalid."
             exit 1
          fi
          
          # 6. Add EC2 host to known_hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # 7. Cleanup sensitive temporary files
          rm -f ~/.ssh/id.ppk ~/.ssh/passphrase.txt
          echo "SSH key setup complete."

      - name: Transfer docker-compose file to EC2
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            docker-compose.prod.yml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/docker-compose.yml

      - name: Transfer deployment script to EC2
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            scripts/deploy-ec2.sh \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/deploy-ec2.sh

      - name: Create .env file on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "cat > /tmp/.env << 'EOF'
          ${{ secrets.BACKEND_ENV }}
          ${{ secrets.NAMEK_ENV }}
          EOF"

      - name: Execute deployment script on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "sudo bash /tmp/deploy-ec2.sh \
              '${{ secrets.GITHUB_PAT }}' \
              '${{ secrets.GITHUB_REPO }}' \
              '${{ secrets.API_GATEWAY_URL }}'"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "docker ps --filter 'name=abdul' --format 'table {{.Names}}\t{{.Status}}'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa