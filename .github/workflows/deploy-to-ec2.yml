name: Deploy to EC2 (Remote Build)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key (PPK with Passphrase)
        env:
          # SECURITY CRITICAL: Load secrets into Env Vars to prevent shell injection issues
          # This fixes issues where special chars in passwords (e.g. $, ", \) break the script
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.EC2_SSH_PASSPHRASE }}
        run: |
          # Install PuTTY tools
          sudo apt-get update
          sudo apt-get install -y putty-tools
          
          mkdir -p $HOME/.ssh
          chmod 700 $HOME/.ssh
          
          # 1. Save PPK from Env Var
          echo "$SSH_KEY" > $HOME/.ssh/id.ppk
          
          # 2. Save Passphrase from Env Var
          # printf ensures exact string handling without adding/removing newlines
          printf "%s" "$SSH_PASS" > $HOME/.ssh/passphrase.txt
          
          # 3. Convert PPK to OpenSSH format
          echo "Converting PPK to OpenSSH format..."
          
          # Use --old-passphrase to read the password file
          if ! puttygen $HOME/.ssh/id.ppk -O private-openssh -o $HOME/.ssh/id_rsa --old-passphrase $HOME/.ssh/passphrase.txt; then
             echo "::error::Puttygen failed. Check if the PPK is valid or passphrase is correct."
             exit 1
          fi
          
          # 4. Set permissions
          chmod 600 $HOME/.ssh/id_rsa
          
          # 5. Verify the key (Must be unencrypted now)
          # ssh-keygen -y reads the private key and prints public key. 
          # If it asks for a passphrase here, conversion failed to decrypt the key.
          if ! ssh-keygen -y -f $HOME/.ssh/id_rsa > /dev/null; then
             echo "::error::Key is still encrypted! The passphrase provided did not match the PPK."
             exit 1
          fi
          
          # 6. Add host to known_hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> $HOME/.ssh/known_hosts 2>/dev/null || true
          
          # 7. Cleanup
          rm -f $HOME/.ssh/id.ppk $HOME/.ssh/passphrase.txt
          echo "SSH key setup success."

      - name: Transfer docker-compose file to EC2
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            docker-compose.prod.yml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/docker-compose.yml

      - name: Transfer deployment script to EC2
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            scripts/deploy-ec2.sh \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/deploy-ec2.sh

      - name: Create .env file on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "cat > /tmp/.env << 'EOF'
          ${{ secrets.BACKEND_ENV }}
          ${{ secrets.NAMEK_ENV }}
          EOF"

      - name: Execute deployment script on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "sudo bash /tmp/deploy-ec2.sh \
              '${{ secrets.GITHUB_PAT }}' \
              '${{ secrets.GITHUB_REPO }}' \
              '${{ secrets.API_GATEWAY_URL }}'"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "docker ps --filter 'name=abdul' --format 'table {{.Names}}\t{{.Status}}'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa