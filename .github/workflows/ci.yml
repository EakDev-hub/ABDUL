name: CI - Build and Test

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - 'dashboard/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dashboard/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Type check with TypeScript
        working-directory: ./dashboard
        run: npm run type-check
        continue-on-error: true

      - name: Build production bundle
        working-directory: ./dashboard
        run: npm run build

      - name: Check build output
        working-directory: ./dashboard
        run: |
          if [ -d "dist" ]; then
            echo "✓ Build successful"
            du -sh dist
            ls -la dist/
          else
            echo "✗ Build failed - dist directory not found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: dashboard/dist/
          retention-days: 5

  docker-build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/docker/Dockerfile.dev
          push: false
          tags: dashboard:dev-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/docker/Dockerfile
          push: false
          tags: dashboard:prod-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test production image
        run: |
          docker build -f ./dashboard/docker/Dockerfile -t dashboard:test ./dashboard
          echo "✓ Production Docker image built successfully"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Check for security vulnerabilities
        working-directory: ./dashboard
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Verify package.json
        working-directory: ./dashboard
        run: |
          echo "Checking package.json..."
          cat package.json | grep -E '"name"|"version"|"scripts"'

  summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-test, code-quality]
    if: always()
    
    steps:
      - name: Check job status
        run: |
          echo "Build and Test: ${{ needs.build-and-test.result }}"
          echo "Docker Build Test: ${{ needs.docker-build-test.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          
          if [ "${{ needs.build-and-test.result }}" = "failure" ] || \
             [ "${{ needs.docker-build-test.result }}" = "failure" ] || \
             [ "${{ needs.code-quality.result }}" = "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
          fi